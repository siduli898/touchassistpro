<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Outer Ring (Assistive Touch Halo) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="12" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#cyan-glow)" stroke-width="8" stroke-dasharray="16 12" opacity="0.8" />
  
  <!-- Central Glowing Touch Bubble -->
  <circle cx="256" cy="256" r="96" fill="#1e293b" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="76" fill="url(#cyan-glow)" />
  <circle cx="256" cy="256" r="48" fill="#ffffff" opacity="0.95" />
  
  <!-- 4 Cardinal Touch Points (Home, Power, Vol+, Vol-) -->
  <circle cx="256" cy="116" r="16" fill="#10b981" />
  <circle cx="256" cy="396" r="16" fill="#ef4444" />
  <circle cx="116" cy="256" r="16" fill="#38bdf8" />
  <circle cx="396" cy="256" r="16" fill="#38bdf8" />
</svg>
